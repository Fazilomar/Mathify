name: Build Android APK

on:
  push:
    branches: [main, 'feat/**']
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Generate or sync Capacitor Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build debug APK
        run: ./android/gradlew --no-daemon --stacktrace assembleDebug

      - name: Name release artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/mathify-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathify-apk-${{ github.sha }}
          path: frontend/android/app/build/outputs/apk/debug/mathify-debug.apk
          if-no-files-found: error

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/android/app/build/outputs/apk/debug/mathify-debug.apk
          name: Mathify ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            This unsigned debug APK is intended for direct Android sideloading.
            Keep Play Protect enabled and install only releases from this repository.